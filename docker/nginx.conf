server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass https://nordgen.selfhoster.win/api/;
        proxy_ssl_server_name on;
        proxy_ssl_name nordgen.selfhoster.win;

        proxy_http_version 1.1;
        proxy_set_header Host nordgen.selfhoster.win;

        # The upstream Worker expects same-origin browser metadata.
        # The local Docker UI is intentionally proxied through the
        # existing hosted API, so present the trusted upstream origin.
        proxy_set_header Origin https://nordgen.selfhoster.win;
        proxy_set_header Sec-Fetch-Site same-origin;
        proxy_set_header Sec-Fetch-Mode cors;
        proxy_set_header Sec-Fetch-Dest empty;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 20s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering off;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
